plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.5'
    id 'io.spring.dependency-management' version '1.1.4'
}

group = 'com.drink'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = '17'
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
    useJUnitPlatform()
}

def hasNpm = false
try {
    def checkNpm = System.getProperty('os.name').toLowerCase().contains('windows') ? 'npm.cmd' : 'npm'
    def process = new ProcessBuilder(checkNpm, '--version').start()
    process.waitFor()
    hasNpm = process.exitValue() == 0
} catch (Exception e) {
    hasNpm = false
}

task buildReactHelper(type: Exec) {
    workingDir '../frontend'
    if (System.getProperty('os.name').toLowerCase().contains('windows')) {
        commandLine 'npm.cmd', 'run', 'build'
    } else {
        commandLine 'npm', 'run', 'build'
    }
}

task installReactDeps(type: Exec) {
    workingDir '../frontend'
    if (System.getProperty('os.name').toLowerCase().contains('windows')) {
        commandLine 'npm.cmd', 'install'
    } else {
        commandLine 'npm', 'install'
    }
}

task copyReactBuildFiles(type: Copy) {
    if (hasNpm) {
        dependsOn installReactDeps
        dependsOn buildReactHelper
    }
    from '../frontend/dist'
    into 'src/main/resources/static'
}

processResources.dependsOn copyReactBuildFiles

clean.doFirst {
    delete 'src/main/resources/static'
}
